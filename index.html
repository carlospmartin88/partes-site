<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Partes SITE</title>
<meta name="theme-color" content="#0b3d6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Partes SITE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--az:#0b3d6b;--az2:#1565c0;--fondo:#f2f4f7;--borde:#d7dce3;--txt:#1d2733;--gris:#6b7685;
--ok:#2e7d32;--okf:#e3f3e4;--pen:#b7791f;--penf:#fff4d6;--mal:#c62828;--malf:#fde3e3;--nar:#e8710a;--narf:#ffe8d2}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fondo);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
header{background:var(--az);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;flex:1}
header .quien{font-size:12px;opacity:.85;text-align:right}
main{max-width:1100px;margin:0 auto;padding:12px 12px 90px}
nav#tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borde);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{flex:1;border:0;background:none;padding:8px 2px 6px;font-size:11px;color:var(--gris);position:relative}
nav#tabs button b{display:block;font-size:20px;line-height:1.1}
nav#tabs button.act{color:var(--az2);font-weight:600}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--mal);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;min-width:16px}
@media (min-width:900px){
  nav#tabs{position:sticky;top:46px;bottom:auto;border:0;border-bottom:1px solid var(--borde);justify-content:center}
  nav#tabs button{flex:0 0 auto;padding:10px 18px;font-size:14px}
  nav#tabs button b{display:inline;font-size:16px;margin-right:6px}
  main{padding-bottom:30px}
}
.card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:12px;margin-bottom:10px}
.card h2{font-size:16px;margin:0 0 10px}
label{display:block;margin:8px 0 3px;font-size:13px;color:var(--gris)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--borde);border-radius:8px;background:#fff}
textarea{min-height:64px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:10px 14px;background:var(--az2);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:#e6ebf2;color:var(--az)}
.btn.ok{background:var(--ok)}.btn.mal{background:var(--mal)}.btn.nar{background:var(--nar)}
.btn.grande{width:100%;padding:16px;font-size:17px;margin-bottom:10px}
.btn:disabled{opacity:.5}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fila>*{flex:1 1 140px}
.aviso-firma{background:var(--narf);border:2px solid var(--nar);color:#7a3b00;border-radius:8px;padding:10px;font-weight:600;margin:10px 0}
.info{background:#e8f0fb;border-radius:8px;padding:10px;color:var(--az);margin:8px 0}
.error{background:var(--malf);color:var(--mal);border-radius:8px;padding:10px;margin:8px 0}
.chip{display:inline-block;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:600}
.e-pendiente{background:var(--penf);color:var(--pen)}.e-validado{background:var(--okf);color:var(--ok)}
.e-rechazado{background:var(--malf);color:var(--mal)}.e-sinfirma{background:var(--narf);color:var(--nar)}
.e-borrado{background:#eceff3;color:var(--gris)}
.parte{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.parte .mini{width:56px;height:56px;border-radius:6px;background:#e6ebf2;object-fit:cover;flex:0 0 56px;display:flex;align-items:center;justify-content:center;font-size:22px}
.parte .d{flex:1;min-width:0}
.parte .t{font-weight:600}
.parte .s{font-size:12px;color:var(--gris)}
.nota{font-size:13px;color:var(--mal);margin-top:3px}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fotos .f{position:relative}
.fotos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--borde)}
.fotos .x{position:absolute;top:-6px;right:-6px;background:var(--mal);color:#fff;border:0;border-radius:50%;width:24px;height:24px}
.grande-img{width:100%;border-radius:8px;border:1px solid var(--borde);margin-bottom:8px}
.foto-box{position:relative;margin-bottom:10px}
.lote-foto{width:100%;max-height:62vh;object-fit:contain;background:#1d2733;border-radius:8px;display:block}
.lote-mini{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.lote-mini img{width:54px;height:54px;object-fit:cover;border-radius:6px;border:3px solid transparent;cursor:pointer;flex:0 0 auto}
.lote-mini img.act{border-color:var(--az2)}
.lote-mini img.mal{border-color:var(--mal)}
.foto-box canvas{width:100%;border-radius:8px;border:1px solid var(--borde);display:block;background:#eef1f5;cursor:zoom-in}
.foto-giro{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.foto-giro button{border:0;border-radius:50%;width:40px;height:40px;background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer}
.nav-parte{display:flex;align-items:center;gap:6px}
.nav-parte button{min-width:44px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .cab{font-size:11px;text-align:center;color:var(--gris)}
.cal .dia{min-height:54px;border-radius:8px;background:#fff;border:1px solid var(--borde);padding:3px;font-size:12px;cursor:pointer;position:relative}
.cal .dia .n{font-weight:700}
.cal .dia .p{display:block;margin-top:2px;border-radius:4px;font-size:10px;padding:0 2px;white-space:nowrap;overflow:hidden}
.cal .dia.falta{border:2px solid var(--mal);background:#fff7f7}
.cal .dia.finde{background:#f5f6f8}
.cal .dia.vacio{visibility:hidden}
.cal .dia.notrab{background:#eceff3;border-style:dashed}
.cal .dia.hoy{box-shadow:0 0 0 2px var(--az2) inset}
.leyenda{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;font-size:12px}
.lista-sel{max-height:180px;overflow:auto;border:1px solid var(--borde);border-radius:8px;padding:6px}
.lista-sel label{display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--txt);font-size:14px}
.lista-sel input{width:auto}
#modal{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal .caja{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px}
@media (min-width:700px){#modal{align-items:center}#modal .caja{border-radius:14px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;max-width:90%;text-align:center}
.cola{background:var(--penf);border:1px solid #f0d58a;border-radius:8px;padding:10px;margin-bottom:10px}
.hist{font-size:13px;border-left:3px solid var(--borde);padding-left:8px;margin:4px 0}
.peq{font-size:12px;color:var(--gris)}
.login{max-width:420px;margin:30px auto}
.login .logo{font-size:26px;font-weight:800;color:var(--az);text-align:center;margin-bottom:6px}
a{color:var(--az2)}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla td,.tabla th{padding:6px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
</style>
</head>

<header><h1>Partes SITE</h1><div class="quien" id="quien"></div><button class="btn sec" id="btnMenu" hidden style="padding:6px 10px">☰</button></header>

<main id="app"><div class="card">Cargando…</div></main>

const fechaES = iso => { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return d + '-' + m + '-' + y; };
const horaES = ts => { if (!ts) return ''; const d = new Date(ts); return fechaES(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

    $('#modal').hidden = false;
    const fin = v => { $('#modal').hidden = true; caja.innerHTML = ''; $('#modal').onclick = null; res(v); };
    caja.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => {
      const bt = botones[+b.dataset.i];

// ---------- fotos: compresión ----------
async function comprimir(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch (e) {
    bmp = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se puede leer la foto')); i.src = URL.createObjectURL(file); });
  }
  const w0 = bmp.width, h0 = bmp.height;
  let max = 1800, q = 0.72, blob;
  for (let intento = 0; intento < 6; intento++) {
    const k = Math.min(1, max / Math.max(w0, h0));
    const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
    if (blob.size <= 400 * 1024) break;
    if (q > 0.55) q -= 0.08; else max = Math.round(max * 0.85);
  }
  return blob;
}

// ---------- cola sin cobertura (IndexedDB) ----------
const DBN = 'partes_site_cola';
function idb() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('cola', {keyPath: 'id'});
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  });
}
async function colaOp(modo, fn) {
  const db = await idb();
  return new Promise((ok, ko) => {
    const tx = db.transaction('cola', modo), st = tx.objectStore('cola'); let res;
    Promise.resolve(fn(st)).then(r => res = r);
    tx.oncomplete = () => { db.close(); ok(res); }; tx.onerror = () => { db.close(); ko(tx.error); };
  });
}
const colaTodos = () => colaOp('readonly', st => new Promise(ok => { const r = st.getAll(); r.onsuccess = () => ok(r.result || []); }));
const colaGuardar = it => colaOp('readwrite', st => { st.put(it); });
const colaBorrar = id => colaOp('readwrite', st => { st.delete(id); });

let enviando = false;
async function procesarCola() {
  if (enviando || !S.yo) return;
  enviando = true;
  let hubo = false;
  try {
    const items = (await colaTodos()).filter(i => i.uid === S.yo.id && !i.error);
    for (const it of items) {
      try {
        it.rutas = it.rutas || [];
        for (let i = it.rutas.length; i < it.fotos.length; i++) {
          const ruta = S.yo.id + '/' + uuid() + '.jpg';
          const {error} = await sb.storage.from('partes').upload(ruta, it.fotos[i], {contentType: 'image/jpeg', upsert: false});
          if (error) throw error;
          it.rutas.push(ruta); await colaGuardar(it);
        }
        if (it.resubir) await rpc('partes_resubir', {p_id: it.resubir, p_fotos: it.rutas, p_comentario: it.comentario || null, p_sin_firma: !!it.sin_firma});
        else await rpc('partes_subir', {p_tipo: it.tipo, p_obra: it.obra_id, p_fecha: it.fecha, p_fotos: it.rutas, p_comentario: it.comentario || null, p_sin_firma: !!it.sin_firma});
        await colaBorrar(it.id); hubo = true;
        toast('Parte enviado ✔');
      } catch (e) {
        const m = errTxt(e);
        if (/Sin conexión|fetch|timeout|network|503|502|504/i.test(m) || !navigator.onLine) break; // seguirá cuando haya cobertura
        it.error = m; await colaGuardar(it);
      }
    }
  } finally { enviando = false; }
  if (hubo && ['subir', 'partes', 'cal'].includes(S.tab)) pintar();
  else pintarCola();
}
async function pintarCola() {
  const el = document.getElementById('colaBox'); if (!el || !S.yo) return;
  let items = [];
  try { items = (await colaTodos()).filter(i => i.uid === S.yo.id); } catch (e) {}
  if (!items.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="cola"><b>${items.length} parte(s) guardado(s) en el móvil pendiente(s) de enviar</b>
    <div class="peq">Se envían solos en cuanto haya cobertura.</div>
    ${items.map(i => `<div style="margin-top:6px">${i.tipo === 'horas' ? 'Horas' : 'Trabajo'}${i.sin_firma ? ' (sin firmar)' : ''} · ${esc(fechaES(i.fecha))} · ${esc(obraTxt(obraDe(i.obra_id)))} · ${i.fotos.length} foto(s)
      ${i.error ? `<div class="nota">No se pudo enviar: ${esc(i.error)} <button class="btn sec" data-reint="${i.id}" style="padding:3px 8px">Reintentar</button> <button class="btn mal" data-cborrar="${i.id}" style="padding:3px 8px">Quitar</button></div>` : ''}</div>`).join('')}
    <div style="margin-top:8px"><button class="btn sec" id="btnEnviarYa">Enviar ahora</button></div></div>`;
  el.querySelectorAll('[data-reint]').forEach(b => b.onclick = async () => { const it = (await colaTodos()).find(x => x.id === b.dataset.reint); delete it.error; await colaGuardar(it); procesarCola(); });
  el.querySelectorAll('[data-cborrar]').forEach(b => b.onclick = async () => { if (await confirmar('Quitar parte', 'Se borra del móvil y no se envía.', 'Quitar', 'mal')) { await colaBorrar(b.dataset.cborrar); pintarCola(); } });
  const be = $('#btnEnviarYa'); if (be) be.onclick = () => procesarCola();
}

    sb.from('partes_usuarios').select('*').order('nombre')
  ]);

  store.set('cache_obras', JSON.stringify(S.obras));

async function urlsFotos(rutas) {
  if (!rutas.length) return {};
  const {data, error} = await sb.storage.from('partes').createSignedUrls(rutas, 3600);
  if (error) return {};
  const m = {}; (data || []).forEach(d => { if (d.signedUrl) m[d.path] = d.signedUrl; }); return m;
}

// ---------- Varios partes de trabajo de una vez: una foto = un parte, cada uno con su fecha ----------
let lote = null;
const isoDe = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
async function empezarLote(files) {
  if (!files.length) return;
  $('#app').innerHTML = '<div class="card">Preparando ' + files.length + ' foto(s)…</div>';
  const items = [];
  for (const f of files) {
    try {
      const b = await comprimir(f);
      const sug = f.lastModified ? isoDe(f.lastModified) : hoyISO();
      items.push({blob: b, url: URL.createObjectURL(b), fecha: sug > hoyISO() ? hoyISO() : sug, sugerida: true, sinFirma: false, hoja: false});
    } catch (e) { toast(errTxt(e)); }
  }
  if (!items.length) return vistaSubir();
  lote = {obra: store.get('ultima_obra') || '', items, i: 0};
  vistaLote();
}
function vistaLote() {
  const L = lote, it = L.items[L.i], n = L.items.length, app = $('#app');
  const obrasAct = S.obras.filter(o => o.activa);
  const malFecha = x => !x.hoja && (!x.fecha || x.fecha > hoyISO());
  app.innerHTML = `<div class="card"><h2>📚 Varios partes de trabajo (${n} foto${n > 1 ? 's' : ''})</h2>
    <label>Obra (para todos)</label><select id="lObra"><option value="">— Elige la obra —</option>${obrasAct.map(o => `<option value="${o.id}" ${String(o.id) === String(L.obra) ? 'selected' : ''}>${esc(obraTxt(o))}</option>`).join('')}</select>
    <div class="lote-mini">${L.items.map((x, k) => `<img src="${x.url}" data-k="${k}" class="${k === L.i ? 'act' : ''} ${malFecha(x) ? 'mal' : ''}" title="${x.hoja ? 'otra hoja' : fechaES(x.fecha)}">`).join('')}</div>
    <div class="fila" style="flex-wrap:nowrap;align-items:center"><button class="btn sec" id="lAnt" style="flex:0 0 auto" ${L.i === 0 ? 'disabled' : ''}>◀</button>
      <b style="text-align:center">Foto ${L.i + 1} de ${n}</b><button class="btn sec" id="lSig" style="flex:0 0 auto" ${L.i >= n - 1 ? 'disabled' : ''}>▶</button></div>
    <div class="foto-box" style="margin-top:8px"><img class="lote-foto" src="${it.url}" id="lImg">
      <div class="foto-giro"><button id="lGiro" title="Girar">⟳</button><button id="lQuitar" title="Quitar esta foto">×</button></div></div>
    ${L.i > 0 ? `<label style="display:flex;gap:8px;align-items:center;color:var(--txt);font-size:15px"><input type="checkbox" id="lHoja" style="width:auto" ${it.hoja ? 'checked' : ''}> Es otra hoja del parte anterior</label>` : ''}
    ${it.hoja ? '<div class="info">Se enviará junto con la foto anterior, en el mismo parte.</div>' : `
    <label>Día de este parte ${it.sugerida ? '<span class="peq">(sugerido por la fecha de la foto: compruébalo)</span>' : ''}</label>
    <input type="date" id="lFecha" value="${it.fecha}" max="${hoyISO()}" style="font-size:18px">
    <label style="display:flex;gap:8px;align-items:center;color:var(--txt);font-size:15px;margin-top:8px"><input type="checkbox" id="lSinFirma" style="width:auto" ${it.sinFirma ? 'checked' : ''}> No lleva la firma del cliente (se enviará como NO FIRMADO)</label>`}
    <div class="fila" style="margin-top:14px"><button class="btn sec" id="lCancelar">Cancelar</button>
      ${L.i < n - 1 ? '<button class="btn" id="lSigBig">Siguiente foto ▶</button>' : ''}<button class="btn ok" id="lEnviar">Enviar ${n} foto(s)</button></div></div>`;
  const guardar = () => {
    L.obra = $('#lObra').value;
    if ($('#lFecha')) { if ($('#lFecha').value !== it.fecha) it.sugerida = false; it.fecha = $('#lFecha').value; }
    if ($('#lSinFirma')) it.sinFirma = $('#lSinFirma').checked;
  };
  const ir = k => { guardar(); L.i = Math.max(0, Math.min(n - 1, k)); vistaLote(); };
  $('#lAnt').onclick = () => ir(L.i - 1); $('#lSig').onclick = () => ir(L.i + 1);
  if ($('#lSigBig')) $('#lSigBig').onclick = () => ir(L.i + 1);
  app.querySelectorAll('.lote-mini img').forEach(im => im.onclick = () => ir(+im.dataset.k));
  if ($('#lHoja')) $('#lHoja').onchange = () => { guardar(); it.hoja = $('#lHoja').checked; vistaLote(); };
  $('#lGiro').onclick = async () => { guardar(); it.blob = await blobGirado(it.blob, 90); URL.revokeObjectURL(it.url); it.url = URL.createObjectURL(it.blob); vistaLote(); };
  $('#lQuitar').onclick = async () => {
    if (!await confirmar('Quitar foto', 'Esta foto no se enviará.', 'Quitar', 'mal')) return;
    guardar(); L.items.splice(L.i, 1); if (!L.items.length) { lote = null; return vistaSubir(); }
    if (L.items[0]) L.items[0].hoja = false; L.i = Math.min(L.i, L.items.length - 1); vistaLote();
  };
  let x0 = null; const img = $('#lImg');
  img.ontouchstart = e => { x0 = e.touches[0].clientX; };
  img.ontouchend = e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) ir(L.i + (dx < 0 ? 1 : -1)); };
  $('#lCancelar').onclick = async () => { if (!await confirmar('Cancelar', 'Se pierden las fotos elegidas.', 'Sí, cancelar', 'mal')) return; lote = null; vistaSubir(); };
  $('#lEnviar').onclick = async () => {
    guardar();
    if (!L.obra) return toast('Elige la obra');
    const k = L.items.findIndex(malFecha);
    if (k >= 0) { L.i = k; vistaLote(); return toast('Falta el día (o es futuro) en la foto ' + (k + 1)); }
    // agrupar: las "otra hoja" van con el parte anterior
    const partes = [];
    for (const x of L.items) { if (x.hoja && partes.length) partes[partes.length - 1].fotos.push(x.blob); else partes.push({fecha: x.fecha, sinFirma: x.sinFirma, fotos: [x.blob]}); }
    const sinFir = partes.filter(p => p.sinFirma).length;
    const resumen = partes.map(p => fechaES(p.fecha) + (p.fotos.length > 1 ? ' (' + p.fotos.length + ' hojas)' : '') + (p.sinFirma ? ' — sin firma' : '')).join('<br>');
    let aviso = '';
    try {
      const {data} = await sb.from('partes').select('fecha').eq('obra_id', +L.obra).eq('tipo', 'trabajo').in('fecha', [...new Set(partes.map(p => p.fecha))]);
      if (data && data.length) aviso = `<div class="error">Ya hay partes de esta obra estos días: ${[...new Set(data.map(d => fechaES(d.fecha)))].join(', ')}</div>`;
    } catch (e) {}
    if (!await confirmar(`Enviar ${partes.length} parte(s)`, `<b>${esc(obraTxt(obraDe(+L.obra)))}</b><br>${resumen}${aviso}${sinFir ? `<div class="aviso-firma">${sinFir} parte(s) irán como NO FIRMADOS y habrá que subirlos de nuevo con la firma.</div>` : ''}`, 'Enviar', 'ok')) return;
    try {
      for (const p of partes) {
        await colaGuardar({id: uuid(), uid: S.yo.id, tipo: 'trabajo', obra_id: +L.obra, fecha: p.fecha, comentario: '', resubir: null, sin_firma: p.sinFirma, fotos: p.fotos, creado: Date.now()});
      }
    } catch (e) { return avisar('Error', 'No se han podido guardar los partes en el móvil: ' + esc(errTxt(e))); }
    store.set('ultima_obra', String(L.obra));

// Dibuja la foto girada en un canvas (el giro se guarda en el parte para todos)

  const g = ((grados || 0) % 360 + 360) % 360, w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (!w || !h) return;

  const c = cv.getContext('2d'); c.save(); c.translate(cv.width / 2, cv.height / 2); c.rotate(g * Math.PI / 180); c.drawImage(img, -w / 2, -h / 2); c.restore();
}
async function blobGirado(blob, grados) {
  const g = ((grados || 0) % 360 + 360) % 360; if (!g) return blob;
  const bmp = await createImageBitmap(blob); const cv = document.createElement('canvas');
  const rot = g === 90 || g === 270; cv.width = rot ? bmp.height : bmp.width; cv.height = rot ? bmp.width : bmp.height;
  const c = cv.getContext('2d'); c.translate(cv.width / 2, cv.height / 2); c.rotate(g * Math.PI / 180); c.drawImage(bmp, -bmp.width / 2, -bmp.height / 2);

function nombresZip(lista) {
  // Un nombre por foto: 14-05-2026.jpg, 14-05-2026 2.jpg, … (orden de subida)
  const cuenta = {}, out = [];
  for (const p of lista) for (const r of p.fotos) {
    const base = fechaES(p.fecha); cuenta[base] = (cuenta[base] || 0) + 1;
    out.push({parte: p, ruta: r, nombre: base + (cuenta[base] > 1 ? ' ' + cuenta[base] : '') + '.jpg'});
  }
  return out;
}
async function descargarZip(listaMes) {
  const tipo = $('#dTipo').value, est = $('#zipEstado'), o = obraDe(+S.cal.obra);
  const tipos = tipo === 'ambos' ? ['trabajo', 'horas'] : [tipo];
  const zip = new JSZip(); let n = 0, sinFoto = 0; const ids = [];
  $('#bZip').disabled = true;
  try {
    for (const t of tipos) {
      const lista = listaMes.filter(p => p.tipo === t);
      const conFoto = lista.filter(p => !p.fotos_borradas); sinFoto += lista.length - conFoto.length;
      const carpeta = tipo === 'ambos' ? zip.folder(t === 'trabajo' ? 'Partes de trabajo' : 'Partes de horas') : zip;
      const items = nombresZip(conFoto);
      for (const it of items) {
        est.textContent = `Descargando foto ${++n} de ${items.length}…`;
        const {data, error} = await sb.storage.from('partes').download(it.ruta);
        if (error) throw error;
        const g = (it.parte.giros || {})[it.ruta];
        carpeta.file(it.nombre, g ? await blobGirado(data, g) : data);
        if (!ids.includes(it.parte.id)) ids.push(it.parte.id);
      }
    }
    if (!n) { est.textContent = sinFoto ? 'Las fotos de este mes ya se borraron del servidor.' : 'No hay partes en este mes.'; return; }
    est.textContent = 'Preparando ZIP…';
    const blob = await zip.generateAsync({type: 'blob'});
    const [y, m] = S.cal.mes.split('-');
    const nombre = `${(o && o.codigo) ? o.codigo + ' ' : ''}${(o ? o.nombre : '').replace(/[\\/:*?"<>|]/g, '')} - ${tipo === 'horas' ? 'Partes horas' : tipo === 'trabajo' ? 'Partes trabajo' : 'Partes'} ${m}-${y}.zip`;
    await guardarArchivo(nombre, blob, 'application/zip');
    try { await rpc('partes_marcar_descargado', {p_ids: ids}); } catch (e) {}
    S.descargados = {obra: S.cal.obra, mes: S.cal.mes, ids};
    est.textContent = `✔ ${n} foto(s) en ${nombre}` + (sinFoto ? ` · ${sinFoto} parte(s) ya sin fotos en el servidor` : '');
    const {data} = await sb.from('partes').select('*').in('id', ids);
    pintarBorrar((listaMes || []).map(p => (data || []).find(d => d.id === p.id) || p));
  } catch (e) { est.textContent = 'Error: ' + errTxt(e); }
  finally { $('#bZip').disabled = false; }
}
function pintarBorrar(lista) {
  const box = $('#borrarBox'); if (!box) return;
  const borrables = lista.filter(p => p.descargado_at && !p.fotos_borradas);
  if (!tecnicoDe(+S.cal.obra) || !borrables.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="info" style="margin-top:10px">${borrables.length} parte(s) de este mes ya descargados con las fotos todavía en el servidor.
    <div style="margin-top:6px"><button class="btn mal" id="bBorrar">🗑️ Borrar sus fotos del servidor</button></div>
    <div class="peq">Solo se borran las fotos; el registro de cada parte (fecha, estado, notas, partida) se queda.</div></div>`;

}
async function borrarFotos(ids) {
  if (!await confirmar('Borrar fotos del servidor', `Se borran las fotos de ${ids.length} parte(s) ya descargados. Asegúrate de tener el ZIP guardado y archivado. No se puede deshacer.`, 'Borrar fotos', 'mal')) return;
  try {
    const filas = await rpc('partes_fotos_borrables', {p_ids: ids});
    const rutas = [...new Set((filas || []).map(f => f.ruta))];
    for (let i = 0; i < rutas.length; i += 100) {
      const {error} = await sb.storage.from('partes').remove(rutas.slice(i, i + 100));
      if (error) throw error;
    }
    const n = await rpc('partes_marcar_borradas', {p_ids: ids});
    toast(`Fotos borradas de ${n} parte(s)`); vistaCalendario();
  } catch (e) { avisar('Error', esc(errTxt(e))); }
}
async function guardarArchivo(nombre, blob, mime) {
  if (AB && AB.saveFile) {
    const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
    const res = AB.saveFile(nombre, b64, mime);
    toast(res ? 'Guardado en ' + res : 'Guardado en Descargas', 4000); return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

  const usu = u.usuario || (u.email || '').replace(PREF_USU, '').replace(DOMINIO_USU, '');
  return `<div class="hist" style="cursor:pointer" data-usu="${u.id}"><b>${esc(u.nombre || usu)}</b> <span class="peq">${esc(usu)}</span><br>
    <span class="peq">${u.is_admin ? 'Administrador · ' : ''}${u.activo ? esc(u.rol || 'sin puesto') : (u.rol ? esc(u.rol) + ' (desactivado)' : 'Pide: ' + esc(ROL_TXT[u.rol_solicitado] || '¿?'))}${u.rol_pedidos ? ' · Pedidos: ' + esc(ROL_PEDIDOS[u.rol_pedidos] || u.rol_pedidos) + (u.rol_manual && ROL_DESDE_PEDIDOS[u.rol_pedidos] && ROL_DESDE_PEDIDOS[u.rol_pedidos] !== u.rol ? ' (cambiado en Partes)' : '') : ''}</span></div>`;
}
async function editarUsuario(u) {
  if (!u) return;
  if (u.id === S.yo.id) return toast('Tu propio puesto no se cambia desde aquí');
  const soloAdm = u.is_admin || ['Técnico', 'Administración'].includes(u.rol);
  if (soloAdm && !esAdmin()) return toast('A este usuario solo lo cambia el administrador');
  const opciones = esAdmin() ? ROLES : ['Operario', 'Encargado'];
  const valRol = u.rol || (opciones.includes(u.rol_solicitado) ? u.rol_solicitado : 'Operario');
  const r = await ask({titulo: u.nombre || u.usuario || u.email,
    html: `${u.rol_pedidos ? `<div class="info">En Pedidos: <b>${esc(ROL_PEDIDOS[u.rol_pedidos] || u.rol_pedidos)}</b>${ROL_DESDE_PEDIDOS[u.rol_pedidos] ? ' → en Partes: ' + esc(ROL_DESDE_PEDIDOS[u.rol_pedidos]) : ' (sin puesto equivalente en Partes)'}${u.rol_manual ? '<br>Ahora tiene un puesto puesto a mano en Partes.' : ''}</div>` : ''}${u.rol_solicitado && !u.activo ? `<div class="info">Pide: <b>${esc(ROL_TXT[u.rol_solicitado] || u.rol_solicitado)}</b>${!esAdmin() && !opciones.includes(u.rol_solicitado) ? ' (solo lo aprueba el administrador)' : ''}</div>` : ''}
      <label>Puesto</label><select id="uRol">${opciones.map(x => `<option value="${x}" ${x === valRol ? 'selected' : ''}>${esc(ROL_TXT[x])}</option>`).join('')}</select>
      <label style="display:flex;gap:8px;align-items:center;color:var(--txt)"><input type="checkbox" id="uAct" style="width:auto" ${u.activo ? 'checked' : ''}> Activo (puede usar la app)</label>`,
    campos: [{label: 'Nombre', valor: u.nombre || ''}],
    botones: [{txt: 'Cancelar', val: false, cls: 'sec'}, {txt: 'Contraseña', val: 'clave', cls: 'sec'},
      ...(u.rol_manual && ROL_DESDE_PEDIDOS[u.rol_pedidos] ? [{txt: 'Usar puesto de Pedidos', val: 'pedidos', cls: 'sec'}] : []),
      {txt: '🗑️ Quitar de Partes', val: 'quitar', cls: 'mal'}, {txt: 'Guardar', val: 'ok'}]});
  // ask() cierra el modal: leemos los valores antes de que se borre
  if (!r) return;
  if (r.val === 'clave') return ponerClave(u);
  if (r.val === 'quitar') return quitarUsuario(u);
  if (r.val === 'pedidos') {
    try { await rpc('partes_usar_pedidos', {p_id: u.id}); toast('Ahora usa el puesto de Pedidos'); vistaAdmin(); } catch (e) { avisar('Error', esc(errTxt(e))); }
    return;
  }
  try { await rpc('partes_set_usuario', {p_id: u.id, p_rol: usuSel.rol, p_activo: usuSel.act, p_nombre: r.vals[0]}); toast('Guardado'); vistaAdmin(); }
  catch (e) { avisar('Error', esc(errTxt(e))); }
}
const usuSel = {rol: null, act: false};
let accRolSel = null;
document.addEventListener('change', e => { if (e.target.id === 'accRol') accRolSel = e.target.value; });
new MutationObserver(() => { const r = document.getElementById('accRol'); if (r && !r.dataset.leido) { r.dataset.leido = 1; accRolSel = r.value; } }).observe(document.getElementById('modalCaja'), {childList: true});
document.addEventListener('input', e => { if (e.target.id === 'uRol') usuSel.rol = e.target.value; if (e.target.id === 'uAct') usuSel.act = e.target.checked; });
document.addEventListener('change', e => { if (e.target.id === 'uRol') usuSel.rol = e.target.value; if (e.target.id === 'uAct') usuSel.act = e.target.checked; });
new MutationObserver(() => { const r = document.getElementById('uRol'), a = document.getElementById('uAct'); if (r && a && !r.dataset.leido) { r.dataset.leido = 1; usuSel.rol = r.value; usuSel.act = a.checked; } }).observe(document.getElementById('modalCaja'), {childList: true});
async function quitarUsuario(u) {
  if (!u) return;
  const ok = await confirmar('Quitar de Partes', `<b>${esc(u.nombre || u.usuario || u.email)}</b> dejará de poder entrar en Partes SITE y se quita de las obras.<br>Su cuenta y su puesto en <b>Pedidos SITE no cambian</b>. Se le puede volver a dar acceso más adelante.`, 'Quitar', 'mal');
  if (!ok) return;
  try { await rpc('partes_quitar_usuario', {p_id: u.id}); toast('Quitado de Partes'); vistaAdmin(); } catch (e) { avisar('No se ha quitado', esc(errTxt(e))); }
}
async function ponerClave(u) {
  if (!u) return;
  const r = await ask({titulo: 'Contraseña nueva para ' + (u.nombre || u.usuario || u.email), campos: [{label: 'Contraseña nueva (mín. 6)', tipo: 'text'}], botones: [{txt: 'Cancelar', val: false, cls: 'sec'}, {txt: 'Guardar', val: true}]});
  if (!r) return;
  try { await rpc('partes_restablecer_clave', {p_id: u.id, p_clave: r.vals[0]}); avisar('Contraseña cambiada', 'Díselo a ' + esc(u.nombre || u.usuario || '') + '.'); vistaAdmin(); }
  catch (e) { avisar('Error', esc(errTxt(e))); }
}
const obraSel = {enc: [], tec: [], activa: true};
async function editarObra(o) {
  const enc = S.usuarios.filter(u => u.activo && ['Encargado', 'Técnico'].includes(u.rol));
  const tec = S.usuarios.filter(u => u.activo && (u.rol === 'Técnico' || u.is_admin));
  obraSel.enc = o ? [...(o.encargados || [])] : []; obraSel.tec = o ? [...(o.tecnicos || [])] : [S.yo.id]; obraSel.activa = o ? o.activa : true;
  const lista = (us, sel, k) => `<div class="lista-sel">${us.map(u => `<label><input type="checkbox" data-k="${k}" value="${u.id}" ${sel.includes(u.id) ? 'checked' : ''}> ${esc(u.nombre || u.usuario || u.email)} <span class="peq">${esc(u.rol || '')}</span></label>`).join('') || '<span class="peq">No hay usuarios con ese puesto</span>'}</div>`;
  const r = await ask({titulo: o ? 'Editar obra' : 'Nueva obra',
    campos: [{label: 'Código (M + números, ej. M1052)', valor: o ? o.codigo || '' : ''}, {label: 'Nombre de la obra', valor: o ? o.nombre : ''}],
    html: `<label>Encargado(s): validan los partes de trabajo</label>${lista(enc, obraSel.enc, 'enc')}
      <label>Técnico(s): ven los partes y validan los de horas</label>${lista(tec, obraSel.tec, 'tec')}
      <label style="display:flex;gap:8px;align-items:center;color:var(--txt)"><input type="checkbox" data-k="act" style="width:auto" ${obraSel.activa ? 'checked' : ''}> Obra abierta (se pueden subir partes)</label>`,
    botones: [{txt: 'Cancelar', val: false, cls: 'sec'}, {txt: 'Guardar', val: true}]});
  if (!r) return;
  try {
    await rpc('partes_guardar_obra', {p_id: o ? o.id : null, p_codigo: r.vals[0], p_nombre: r.vals[1], p_activa: obraSel.activa, p_encargados: obraSel.enc, p_tecnicos: obraSel.tec});
    toast('Obra guardada'); vistaAdmin();
  } catch (e) { avisar('Error', esc(errTxt(e))); }
}
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  if (k === 'act') { obraSel.activa = e.target.checked; return; }
  const arr = obraSel[k]; const v = e.target.value; const i = arr.indexOf(v);
  if (e.target.checked && i < 0) arr.push(v); if (!e.target.checked && i >= 0) arr.splice(i, 1);
});

// ---------- eventos globales ----------
window.addEventListener('online', () => procesarCola());
setInterval(() => { if (navigator.onLine) procesarCola(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.yo) { comprobarAvisos(false); procesarCola(); if (Date.now() - ultimaComprobacion > 6 * 3600e3) comprobarActualizacion(); } });
window.__abrirParte = id => abrirParte({id: +id}); // lo usa Android al tocar un aviso
try { if (NAT) NAT.ok(); } catch (e) {}
iniciar().catch(e => pantallaLogin(errTxt(e)));
</script>
